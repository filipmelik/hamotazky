openapi: '3.0.0'
info:
  version: '1.0.0'
  title: 'Czech HAM Test Questions API'
  description: 'API for serving tests and test questions for OK (Czech) HAM radio licence' 

servers:
  - url: https://hamotazky.cz

paths:
  /api/v1/topics:
    parameters:
      - $ref: '#/components/parameters/OptionalLicenceClassQueryParam'

    get:
      summary: Get topic list for selected licence class
      tags: 
        - api-v1
      responses:
        '200':
          description: The topics list for `licenceClass`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicList'
        400:
          description: Invalid `licenceClass` provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/grouped-topics:
    parameters:
      - $ref: '#/components/parameters/OptionalLicenceClassQueryParam'
    get:
      summary: Get list of topic groups where each group contains it topic list for `licenceClass`
      tags: 
        - api-v1
      responses:
        '200':
          description: The list of topic groups where each group contains it topic list for `licenceClass`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicGroupList'
        400:
          description: Invalid `licenceClass` provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/questions-by-topic-id:
    parameters:
      - $ref: '#/components/parameters/TopicIdQueryParam'
      - $ref: '#/components/parameters/OptionalLicenceClassQueryParam'
    get:
      summary: Get all questions for selected topic and licence class
      tags: 
        - api-v1
      responses:
        '200':
          description: All questions for selected topic and licence class, together with the topic and used licence classes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionsForTopicResponse'
        400:
          description: Invalid `topicId` or `licenceClass` supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Topic with `topicId` does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'                             

  /api/v1/questions/{questionIds}:
    parameters:
      - $ref: '#/components/parameters/QuestionIdsPathParam'
    get:
      summary: Get questions by their IDs
      description: Questions are returned in the same order as requested. Duplicate IDs are ignored. At most 100 IDs can be requested at once.
      tags: 
        - api-v1
      responses:
        '200':
          description: Requested questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionList'
        400:
          description: Empty, invalid or too many question IDs supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Some of the requested questions do not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/random-questions:
    parameters:
      - $ref: '#/components/parameters/TopicSlugsQueryParam'
      - $ref: '#/components/parameters/OptionalLicenceClassQueryParam'
      - $ref: '#/components/parameters/QuestionCountQueryParam'
    get:
      summary: Get random questions from selected topics and licence class
      description: When there are fewer matching questions than `count`, all matching questions are returned.
      tags: 
        - api-v1
      responses:
        '200':
          description: Randomly selected questions in random order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionList'
        400:
          description: Unknown `topicSlug`, invalid `licenceClass` or `count` supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/get-test:
    parameters:
      - $ref: '#/components/parameters/LicenceClassQueryParam'
    get:
      summary: Prepare new test for licence class
      tags: 
        - api-v1
      responses:
        '200':
          description: Test data for selected licence class
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Test'
        400:
          description: Invalid `licenceClass` supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  
              
  /api/v1/evaluate-test:
    post:
      summary: Evaluate filled test
      tags: 
        - api-v1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilledTest"
            examples:
              evaluationPayloadExample:
                summary: Test evaluation payload example
                externalValue: "/examples/evaluate-test-example.json"


      responses:
        '200':
          description: Test evaluation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEvaluationResult'
        400:
          description: Invalid data supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'  
              

components:
  schemas:

    Question:
      type: object
      required:
        - questionId
        - questionCode
        - text
        - points
        - answers
        - topicId
      properties:
        questionId:
          type: string
        questionCode:
          type: string
        text:
          type: string
        points:
          type: integer
        answers: 
          description: Answers in random order
          type: array
          items:
            $ref: '#/components/schemas/Answer'
        topicId:
          $ref: '#/components/schemas/TopicId'

    QuestionList:
      description: List of Questions
      type: array
      items:
        $ref: "#/components/schemas/Question"

    Answer:
      type: object
      required:
        - answerId
        - text
        - isCorrect
      properties:
        answerId:
          type: string
        text:
          type: string
        isCorrect:
          type: boolean

    Topic:
      type: object
      required:
        - topicId
        - name
        - topicSlug
        - questionCount
        - topicGroupId
      properties:
        topicId:
          $ref: '#/components/schemas/TopicId'
        name:
          type: string
        topicSlug:
          type: string
        questionCount:
          type: integer
        topicGroupId:
          type: string

    TopicList:
      description: List of Topics
      type: array
      items:
        $ref: "#/components/schemas/Topic"

    TopicGroup:
      type: object
      required:
        - topicGroupId
        - name
        - topics
      properties:
        topicGroupId:
          type: string
        name:
          type: string
        topics:
          $ref: "#/components/schemas/TopicList"

    TopicGroupList:
      description: List of TopicGroups
      type: array
      items:
        $ref: "#/components/schemas/TopicGroup"
          

    TopicId:
      description: The unique ID of a topic
      type: string

    LicenceClass:
      description: Licence class
      type: string
      enum:
        - A
        - N

    QuestionsForTopicResponse:
      description: Response for question by topic id endpoint
      type: object
      required:
        - questions
        - topic
        - licenceClasses
      properties:
        questions:
          $ref: "#/components/schemas/QuestionList"
        topic:
          $ref: "#/components/schemas/Topic"
        licenceClasses:
          type: array
          items: 
            $ref: "#/components/schemas/LicenceClass"

    FilledTest:
      description: Test with user answers
      type: object
      required:
        - test
        - answers
      properties:
        test:
          $ref: "#/components/schemas/Test"
        answers:
          $ref: "#/components/schemas/UserTestAnswers"

    Test:
      description: Test data
      type: object
      required:
        - testParts
        - licenceClass
      properties:
        testParts:
          type: array
          items:
            $ref: "#/components/schemas/TestPart"
        licenceClass:
          $ref: "#/components/schemas/LicenceClass"

    TestPart:
      description: Test part
      type: object
      required:
        - topicGroup
        - topicGroupQuestions
      properties:
        topicGroup:
          $ref: "#/components/schemas/TopicGroup"
        topicGroupQuestions:
          $ref: "#/components/schemas/QuestionList"

    UserTestAnswers:
      description: User test answers map, question ID => selected answer ID. Note that an empty map is returned as `[]` in responses.
      type: object
      additionalProperties:
        type: string

    TestEvaluationResult:
      description: Test answers evaluation result wrapper
      type: object
      required:
        - licenceClass
        - answers
        - test
        - result
      properties:
        licenceClass:
          $ref: "#/components/schemas/LicenceClass"
        answers:
          $ref: "#/components/schemas/UserTestAnswers"
        test:
          $ref: "#/components/schemas/Test"
        result:
          $ref: "#/components/schemas/TestEvaluation"

    TestEvaluation:
      description: Test evaluation
      type: object
      required:
        - resultsByTopicGroup
        - totalCorrectAnswers
        - totalWrongAnswers
        - passedOverall
      properties:
        passedOverall:
          type: boolean
        totalWrongAnswers:
          type: integer
        totalCorrectAnswers:
          type: integer
        resultsByTopicGroup:
          description: Results keyed by topic group ID
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TestEvaluationTopicGroupResult"

    TestEvaluationTopicGroupResult:
      description: Evaluated topic group from the test
      type: object
      required:
        - correctAnswersCount
        - wrongAnswersCount
        - groupQuestionCount
        - minimumPointsToPass
        - passed
        - correctAnswersPercentage
      properties:
        correctAnswersCount:
          type: integer
        wrongAnswersCount:
          type: integer
        groupQuestionCount:
          type: integer
        minimumPointsToPass:
          type: integer
        passed:
          type: boolean
        correctAnswersPercentage:
          type: number


    Error:
      type: object
      required:
        - error
        - status
      properties:
        error:
          description: A human readable error message
          type: string
        status:
          description: HTTP status code
          type: integer


  parameters:

    LicenceClassQueryParam:
      name: licenceClass
      description: Selected licence class (case insensitive)
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LicenceClass'

    TopicIdQueryParam:
      name: topicId
      description: Selected topic ID (positive integer)
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/TopicId'

    QuestionIdsPathParam:
      name: questionIds
      description: Comma separated list of question IDs, e.g. `5,1,3`
      in: path
      required: true
      schema:
        type: string

    TopicSlugsQueryParam:
      name: topicSlug
      description: Comma separated list of topic slugs, e.g. `q-kody,zkratky`. When omitted, questions from all topics are used.
      in: query
      required: false
      schema:
        type: string

    OptionalLicenceClassQueryParam:
      name: licenceClass
      description: Limit to questions for selected licence classes, comma separated and case insensitive (e.g. `A`, `N` or `A,N`). When omitted, questions for all licence classes are used.
      in: query
      required: false
      schema:
        type: string

    QuestionCountQueryParam:
      name: count
      description: Number of questions to return
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
